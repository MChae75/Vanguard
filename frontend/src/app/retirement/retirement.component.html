<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
  
  <!-- Left Column: Inputs -->
  <div class="lg:col-span-1 bg-white border border-gray-200 rounded-lg p-6 shadow-sm space-y-6">
    <h3 class="text-md font-semibold text-gray-800 mb-4 border-b pb-2">Plan Details</h3>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Current Age: {{request.currentAge}}</label>
      <mat-slider min="18" max="80" step="1" class="w-full">
        <input matSliderThumb [(ngModel)]="request.currentAge" (ngModelChange)="onInputChange()">
      </mat-slider>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Retirement Age: {{request.retirementAge}}</label>
      <mat-slider min="50" max="100" step="1" class="w-full">
        <input matSliderThumb [(ngModel)]="request.retirementAge" (ngModelChange)="onInputChange()">
      </mat-slider>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Current Savings: {{request.currentSavings | currency:'USD':'symbol':'1.0-0'}}</label>
      <mat-slider min="0" max="1000000" step="5000" class="w-full">
        <input matSliderThumb [(ngModel)]="request.currentSavings" (ngModelChange)="onInputChange()">
      </mat-slider>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Monthly Contribution: {{request.monthlyContribution | currency:'USD':'symbol':'1.0-0'}}</label>
      <mat-slider min="0" max="10000" step="100" class="w-full">
        <input matSliderThumb [(ngModel)]="request.monthlyContribution" (ngModelChange)="onInputChange()">
      </mat-slider>
    </div>
  </div>

  <!-- Right Column: Results & Chart -->
  <div class="lg:col-span-2 space-y-6">
    <div class="bg-gray-50 border border-gray-200 rounded-lg p-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-2">Projected Balance at Retirement</h2>
      <div class="text-5xl font-bold text-red-800">{{ totalProjected | currency:'USD':'symbol':'1.0-0' }}</div>
    </div>

    <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
      <h3 class="text-md font-semibold text-gray-800 mb-4">Growth Over Time</h3>
      <div class="block w-full">
        <canvas baseChart
          [data]="lineChartData"
          [type]="lineChartType"
          [options]="lineChartOptions">
        </canvas>
      </div>
    </div>
  </div>

</div>
